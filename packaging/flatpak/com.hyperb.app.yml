app-id: com.hyperb.app
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: hyperb-desktop
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # local wasm modules and files opened from the command line
  - --filesystem=home
modules:
  - name: hyperb
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/hyperb/cargo
    build-commands:
      - cargo --offline build --release --locked -p hyperb-desktop
      - install -Dm755 target/release/hyperb-desktop -t /app/bin
      - install -Dm644 crates/desktop/com.hyperb.app.desktop -t /app/share/applications
      - install -Dm644 assets/icon.svg /app/share/icons/hicolor/scalable/apps/com.hyperb.app.svg
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - target
          - .flatpak-builder
          - build-dir
          - repo
          - packaging/flatpak/cargo-sources.json
      - cargo-sources.json
