[package]
name = "hyperb-demoapps"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The demo apps. This is a plain library natively (for tests and tooling) and a
# wasm module when built for wasm32 with exactly one app feature selected:
# `just wasm-apps` builds each app into its own module.

[lib]
name = "demoapps"
crate-type = ["cdylib", "rlib"]

[dependencies]
hypereffect.workspace = true
png = "0.18"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
# The text utilities.
aes = "0.8"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
blake2 = "0.10.6"
brotli = "9"
cbc = { version = "0.1", features = ["alloc"] }
chacha20 = "0.9"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
crc32fast = "1.5"
curve25519-dalek = { version = "4.1", features = ["digest"] }
deunicode = "1.6"
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "zeroize"] }
hex = "0.4"
k256 = { version = "0.13", default-features = false, features = ["alloc", "ecdsa", "schnorr"] }
lz4_flex = "0.11"
lzma-rs = "0.3"
md5 = "0.8.1"
p256 = { version = "0.13", default-features = false, features = ["alloc", "ecdsa"] }
pbkdf2 = "0.12"
regex-lite = "0.1.9"
ripemd = "0.1.3"
serde = "1"
sha1 = "0.10.7"
sha2 = "0.10.9"
sha3 = "0.10.9"
unicode-normalization = "0.1.26"
zstd = { version = "0.14", default-features = false }
harper-core = { version = "2.13.0", optional = true }
# Harper needs random numbers in wasm; the module provides its own source, so
# build with `--cfg getrandom_backend="custom"` (see `just wasm-apps`).
getrandom = { version = "0.3", optional = true }

[features]
default = ["grammar"]
# The grammar checker, on Harper, which is large to build.
grammar = ["dep:harper-core", "dep:getrandom"]
# The app that a wasm build hosts; exactly one, with `--no-default-features`.
billsplit = []
chart = []
dbclient = []
finance = []
minecraft = []
pomodoro = []
qr = []
restaurant = []
saas = []
smarthome = []
textutils = []
worldclock = []

[dev-dependencies]
hyperb-core = { workspace = true, features = ["wasm"] }
hypereffect.workspace = true
