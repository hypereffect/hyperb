[package]
name = "hyperb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Scripts and inspects hypereffect apps from the command line"

[[bin]]
name = "hypb"
path = "src/main.rs"

[dependencies]
hyperb-core = { workspace = true, features = ["net", "iroh", "wasm"] }
boa_engine = "0.22"
clap = { version = "4.6", features = ["derive"] }
url = "2"
