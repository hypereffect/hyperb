[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
hyperb-core = { path = "crates/core" }
hypereffect = "0.6"
tokio = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Until hypereffect 0.6 is published.
[patch.crates-io]
hypereffect = { path = "../hypereffect/rust/hypereffect" }
